<div id="modalRegister" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#222; padding:24px; border-radius:12px; width:300px; color:white;">
    <h2>Registrarme</h2>
    <input type="text" id="registerId" placeholder="ID BuzzCast" style="width:100%; padding:8px; margin-bottom:12px;">
    <input type="password" id="registerPassword" placeholder="Contraseña" style="width:100%; padding:8px; margin-bottom:12px;">
    <button id="btnDoRegister" style="padding:10px 18px; margin-bottom:12px;">Crear cuenta</button>
    <p style="color:red;" id="registerError"></p>
    <button id="btnCloseRegister" style="position:absolute; top:12px; right:12px; background:none; border:none; color:white; font-size:18px;">×</button>
  </div>
</div>
