<div id="modalLogin" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#222; padding:24px; border-radius:12px; width:300px; color:white;">
    <h2>Iniciar sesión</h2>
    <input type="text" id="loginId" placeholder="ID BuzzCast" style="width:100%; padding:8px; margin-bottom:12px;">
    <input type="password" id="loginPassword" placeholder="Contraseña" style="width:100%; padding:8px; margin-bottom:12px;">
    <button id="btnDoLogin" style="padding:10px 18px; margin-bottom:12px;">Entrar</button>
    <p style="text-align:center;">
      ¿No tienes cuenta? <a href="#" id="goToRegister" style="color:yellow;">Registrarme</a>
    </p>
    <p style="color:red;" id="loginError"></p>
    <button id="btnCloseLogin" style="position:absolute; top:12px; right:12px; background:none; border:none; color:white; font-size:18px;">×</button>
  </div>
</div>
