<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kovra — Panel de Revendedor</title>
  <style>
    /* Reset y tipografía */
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
    html,body{height:100%}
    body{
      min-height:100vh;
      color:#fff;
      background: #121212;
      background-attachment: fixed; /* fondo fijo */
      overflow-y:auto;
    }

    /* CONTENEDOR PRINCIPAL */
    .container{
      position:relative;
      z-index:10;
      max-width:1100px;
      margin: 0 auto;
      padding: 26px 20px 80px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      min-height:100vh;
    }

    /* INTRO OVERLAY (pantalla completa) */
    .intro-overlay{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:999;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(2px);
      pointer-events:auto;
    }
    .intro-center{
      text-align:center;
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
      justify-content:center;
      max-width:92%;
    }
    .intro-logo {
      width:400px;
      height:400px;
      object-fit:contain;
      opacity:0;
      transform:scale(.6);
      border-radius:14px;
      will-change:opacity,transform;
      filter: drop-shadow(0 14px 36px rgba(0,0,0,0.6));
    }
    .intro-flyer {
      width:720px;
      max-width:92%;
      height:auto;
      opacity:0;
      transform:translateY(12px);
      border-radius:10px;
      will-change:opacity,transform;
      filter: drop-shadow(0 18px 44px rgba(0,0,0,0.6));
    }
    .intro-welcome{
      color:#fff;
      text-align:center;
      opacity:0;
      transform:translateY(8px);
    }
    .intro-welcome h2{
      font-size:2.4rem;
      color:#FFFF00;
      letter-spacing:1px;
    }
    .intro-welcome p{
      color:#ddd;
      margin-top:6px;
      font-size:1rem;
    }

    /* MENU FIJO arriba (logo pequeño + titulo + botones) */
    header.topbar {
      position:sticky;
      top:0px;
      z-index:50;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:8px;
      padding:6px 12px;
      width:100%;
      max-width:1200px;
      margin:0 auto 12px;
      pointer-events:auto;
      backdrop-filter: none;
      background: #121212;
    }
    .topbar-row{
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:center;
      flex-wrap:wrap;
    }
    .topbar-logo{
      width:100px;
      height:auto;
      border-radius:10px;
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
    }
    .topbar-title{
      font-size:1.25rem;
      color:#FFFF00;
      font-weight:800;
      letter-spacing:0.6px;
    }

    .menu-buttons {
      display:flex;
      gap:12px;
      justify-content:center;
      margin-top:6px;
      flex-wrap:wrap;
      margin-bottom: 6px;
    }
    .btn {
      background:linear-gradient(90deg,#0f0f0f,#111);
      border: 2px solid #FFFF00;
      padding:12px 18px;
      border-radius:12px;
      font-weight:700;
      letter-spacing:.6px;
      cursor:pointer;
      color:#fff;
      min-width:200px;
      text-align:center;
      box-shadow:0 6px 20px rgba(0,0,0,0.4);
      transition:transform .14s ease,opacity .14s ease;
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background:linear-gradient(90deg,#151515,#0d0d0d)}

    /* ZONA DINÁMICA (debajo del menu) */
    .content-area{
      width:100%;
      max-width:1100px;
      margin-top:8px;
      display:flex;
      flex-direction:column;
      gap:18px;
      align-items:center;
      padding:6px;
    }

    /* --- NUEVO: PODIO TOP3 --- */
    .podio {
      width:100%;
      display:flex;
      gap:12px;
      align-items:end;
      justify-content:center;
      margin-bottom:6px;
      flex-wrap:wrap;
    }
    .podio-card{
      background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.06);
      padding:12px;
      border-radius:12px;
      min-width:180px;
      max-width:320px;
      text-align:center;
      box-shadow:0 8px 30px rgba(0,0,0,0.5);
      display:flex;
      gap:10px;
      align-items:center;
    }
    .podio-card .medal {
      width:58px;
      height:58px;
      flex:0 0 58px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      color:#111;
    }
    .medal.gold{ background: linear-gradient(180deg,#FFD54A,#FFC107); }
    .medal.silver{ background: linear-gradient(180deg,#e6e9ef,#c8cdd6); color:#111; }
    .medal.bronze{ background: linear-gradient(180deg,#DDA06A,#C07A3A); color:#111; }

    .podio-info{ text-align:left; flex:1; }
    .podio-info .pos { font-weight:800;color:#00ff88;font-size:0.95rem; }
    .podio-info .name { font-weight:700; font-size:1rem; margin-top:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .podio-info .meta { font-size:0.85rem; color:#ddd; margin-top:6px; }

    /* Tablas: mismo estilo visual del original */
    table{
      width:98%;
      border-collapse:collapse;
      text-align:left;
      background:transparent;
    }
    thead{background:linear-gradient(90deg,#C20000,#FF1900)}
    th{padding:14px;font-weight:600;text-transform:uppercase;font-size:.9rem;letter-spacing:.5px}
    tbody tr{border-bottom:1px solid rgba(255,255,255,0.08);transition:background .25s}
    tbody tr:hover{background:rgba(255,255,255,0.06)}
    td{padding:12px;font-size:.95rem}
    .pos{text-align:center;font-weight:700;color:#00ff88}

    /* Estilos para secciones que se muestran/ocultan */
    .panel{
      width:100%;
      display:none;
      opacity:0;
      transform:translateY(8px);
      transition:opacity .36s ease, transform .36s ease;
    }
    .panel.show{
      display:block;
      opacity:1;
      transform:translateY(0);
    }

    /* Gallery thumbs */
    .gallery{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .gallery img.thumb{
      width:25%;
      height:25%;
      object-fit:cover;
      border-radius:8px;
      cursor:pointer;
      border:2px solid rgba(255,255,255,0.04);
      transition:transform .12s ease;
      background:red;
    }
    .gallery img.thumb:active{transform:scale(.98)}

    /* Modal imagen */
    .img-modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.85);
      z-index:9999;
      padding:20px;
    }
    .img-modal.show{display:flex}
    .img-box{
      max-width:1100px;
      width:100%;
      max-height:92vh;
      position:relative;
    }
    .img-box img.full{
      width:100%;
      height:auto;
      border-radius:10px;
      display:block;
    }
    .close-x{
      position:absolute;
      top:-12px;
      right:-12px;
      background:#111;
      border:2px solid rgba(255,255,255,0.08);
      color:#fff;
      width:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
    }


	.ganador-card {
	  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
	  border: 1px solid rgba(255,255,255,0.08);

	  padding: 16px 18px;
	  width: 320px;
	  box-shadow: 0 8px 30px rgba(0,0,0,0.45);
	  transition: transform 0.2s ease;
	}
	
	.ganador-card:hover { transform: translateY(-3px); }
	.ganador-card h3 {
	  color: #FFFF00;
	  font-size: 1.1rem;
	  margin-bottom: 6px;
	  text-align: center;
	}
	
	.ganador-card p {
	  margin: 4px 0;
	  color: #ddd;
	  font-size: 0.95rem;
	  line-height: 1.4;
	}


    /* Responsive */
    @media (max-width:900px){
      .intro-logo{width:180px;height:180px}
      .intro-flyer{width:420px}
      .gallery img.thumb{width:44vw;height:26vw}
      .btn{min-width:150px}
      .podio{gap:10px}
      .podio-card{min-width:44%; max-width:48%;}
      .podio-card .medal{width:48px;height:48px;flex:0 0 48px;font-size:18px}
    }
    @media (max-width:600px){
      .intro-welcome h2{font-size:1.6rem}
      .topbar-title{font-size:1rem}
      .menu-buttons{gap:8px}
      .btn{min-width:120px;padding:10px 12px;font-size:.92rem}
      .podio{flex-direction:column;align-items:stretch;}
      .podio-card{width:100%;}
    }
	



    #btnTickets {
	  display: none !important;
	}
	  
  </style>

    /**********************
     * RENDER TABLAS y GALERÍA
     **********************/
    function renderTickets(){
      const tbody = document.querySelector("#tablaTickets tbody");
      tbody.innerHTML = "";
      compradoresTickets.forEach((c,i)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="pos">#${i+1}</td>
          <td>${c.id}</td>
          <td>${c.nombre}</td>
          <td>${c.tickets}</td>
        `;
        tbody.appendChild(tr);
      });
    }
	
	

	// Renderiza los ganadores
	function renderGanadores() {

		card.className = "ganador-card";
		card.innerHTML = `
		  <h3>${g.concurso}</h3>
		  <p><strong>👤 Ganador:</strong> ${g.nombre}</p>
		  <p><strong>ID:</strong> ${g.id}</p>
		  <p><strong>🎁 Premio:</strong> ${g.premio}</p>
		`;
		lista.appendChild(card);
	  });
	}

	  const premiosDefault = ["1000💎", "200💎", "100💎"];
	
	  // defensiva: si no hay pos, ordenar por diamantes
	  const sorted = Array.isArray(data) ? data.slice() : [];
	  if(sorted.length === 0){
	    podio.innerHTML = '';
	    return;
	  }
	  if(!('pos' in sorted[0])){
	    sorted.sort((a,b)=> (b.diamantes||0) - (a.diamantes||0));
	  } else {
	    sorted.sort((a,b)=> (a.pos||0) - (b.pos||0));
	  }
	
	  const top3 = sorted.slice(0,3);
	  const medalClass = ['gold','silver','bronze'];
	  const labels = ['1º','2º','3º'];
	
	  top3.forEach((t,i)=>{
	    const card = document.createElement('div');
	    card.className = 'podio-card';
	
	    card.innerHTML = `
	      <div class="medal ${medalClass[i]}" aria-hidden="true">
	        ${i===0? '🥇' : i===1? '🥈' : '🥉'}
	      </div>
	
	      <div class="podio-info">
	        <div class="pos">${labels[i]} — #${ t.pos ?? (i+1) }</div>
	        <div class="name" title="${t.nombre}">${t.nombre}</div>
	
	        <div class="meta">
	          ID: ${t.id}<br>
			  Compró: ${(t.diamantes || 0).toLocaleString()}💎
	        </div>
	
	        <div class="premio">
	          Premio: ${premiosDefault[i]}
	        </div>
	      </div>
	    `;
	    podio.appendChild(card);
	  });
	
	  // Si faltan posiciones, rellenar cards vacíos
	  for(let k=top3.length;k<3;k++){
	    const card = document.createElement('div');
	    card.className = 'podio-card';
	    card.innerHTML = `
	      <div class="medal ${medalClass[k]}" aria-hidden="true">
	        ${k===0? '🥇' : k===1? '🥈' : '🥉'}
	      </div>
	
	      <div class="podio-info">
	        <div class="pos">${labels[k]} — #${k+1}</div>
	        <div class="name">Sin participante</div>
	
	        <div class="meta">
	          ID: —<br>
			  Compró: 0💎
	        </div>
	
	        <div class="premio">
	          Premio: ${premiosDefault[k]}
	        </div>
	      </div>
	    `;
	    podio.appendChild(card);
	  }
	}


    function renderDiamantes(){
      // actualizar podio/top3
      renderPodioTop(rankingDiamantes);

      const tbody = document.querySelector("#tablaDiamantes tbody");
      tbody.innerHTML = "";
      // si el array tiene pos, ordenar por pos, si no por diamantes
      const rows = rankingDiamantes.slice();
      if(rows.length && ('pos' in rows[0])) rows.sort((a,b)=>a.pos-b.pos);
      else rows.sort((a,b)=> (b.diamantes||0) - (a.diamantes||0));

      rows.forEach((r,idx)=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="pos">#${r.pos ?? idx+1}</td>
          <td>${r.id}</td>
          <td title="${r.nombre}">${r.nombre}</td>
          <td>${(r.diamantes||0).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderGallery(){
      const g = document.getElementById('gallery');
      g.innerHTML = "";
      flyers.forEach(f=>{
        const img = document.createElement('img');
        img.className = "thumb";
        img.src = f.thumb;
        img.alt = "Flyer " + f.id;
        img.dataset.full = f.full;
        img.addEventListener('click', ()=> openModal(f.full));
        g.appendChild(img);
      });
    }

    /**********************
     * MODAL IMAGEN
     **********************/
    const imgModal = document.getElementById('imgModal');
    const modalImg = document.getElementById('modalImg');
    const closeImgModalBtn = document.getElementById('closeImgModal');

    function openModal(url){
      modalImg.src = url;
      imgModal.classList.add('show');
      imgModal.setAttribute('aria-hidden','false');
    }
    function closeModal(){
      imgModal.classList.remove('show');
      imgModal.setAttribute('aria-hidden','true');
      modalImg.src = "";
    }
    closeImgModalBtn.addEventListener('click', closeModal);
    imgModal.addEventListener('click', (e)=> { if(e.target === imgModal) closeModal(); });

    /**********************
     * NAVEGACIÓN BOTONES (muestra una sola sección cada vez)
     **********************/
    const panelTickets = document.getElementById('panelTickets');
    const panelCompradores = document.getElementById('panelCompradores');
    const panelPromos = document.getElementById('panelPromos');

    function hideAllPanels(){
      [panelTickets, panelCompradores, panelPromos, panelGanadores].forEach(p => {
		p.classList.remove('show');
		p.setAttribute('aria-hidden', 'true');
	  });
    }

    document.getElementById('btnTickets').addEventListener('click', ()=>{
      renderTickets();
      hideAllPanels();
      // allow small delay for fade out
      setTimeout(()=>{ panelTickets.classList.add('show'); panelTickets.setAttribute('aria-hidden','false'); }, 40);
      window.scrollTo({top: document.body.scrollTop + 120, behavior: 'smooth'});
    });

    document.getElementById('btnCompradores').addEventListener('click', ()=>{
      renderDiamantes();
      hideAllPanels();
      setTimeout(()=>{ panelCompradores.classList.add('show'); panelCompradores.setAttribute('aria-hidden','false'); }, 40);
      window.scrollTo({top: document.body.scrollTop + 120, behavior: 'smooth'});
    });

    document.getElementById('btnPromos').addEventListener('click', ()=>{
      renderGallery();
      hideAllPanels();
      setTimeout(()=>{ panelPromos.classList.add('show'); panelPromos.setAttribute('aria-hidden','false'); }, 40);
      window.scrollTo({top: document.body.scrollTop + 120, behavior: 'smooth'});
    });


	const panelGanadores = document.getElementById('panelGanadores');

	document.getElementById('btnGanadores').addEventListener('click', () => {
	  renderGanadores();
	  hideAllPanels();
	  setTimeout(() => {
		panelGanadores.classList.add('show');
		panelGanadores.setAttribute('aria-hidden', 'false');
	  }, 40);
	  window.scrollTo({ top: document.body.scrollTop + 120, behavior: 'smooth' });
	});



    /**********************
     * SECUENCIA INICIAL (control estricto)
     **********************/
    const introOverlay = document.getElementById('introOverlay');
    const introLogo = document.getElementById('introLogo');
    const introFlyer = document.getElementById('introFlyer');
    const introWelcome = document.getElementById('introWelcome');
    const topbar = document.getElementById('topbar');

    function fadeIn(el, ms=400, display='block'){
      el.style.display = display;
      el.style.opacity = 0;
      el.style.transform = 'translateY(8px)';
      requestAnimationFrame(()=> {
        el.style.transition = `opacity ${ms}ms ease, transform ${ms}ms ease`;
        el.style.opacity = 1;
        el.style.transform = 'translateY(0)';
      });
    }
    function fadeOut(el, ms=360){
      el.style.transition = `opacity ${ms}ms ease, transform ${ms}ms ease`;
      el.style.opacity = 0;
      el.style.transform = 'translateY(6px)';
      setTimeout(()=>{ el.style.display = 'none'; }, ms + 20);
    }

    function runIntroSequence(){
      // asegurar estados iniciales
      introLogo.style.opacity = 0;
      introLogo.style.transform = 'scale(.6)';
      introLogo.style.display = 'block';
      introFlyer.style.display = 'none';
      introWelcome.style.display = 'none';
      topbar.style.display = 'none';

      introLogo.style.transition = 'transform 1200ms cubic-bezier(.2,.9,.2,1), opacity 700ms ease';
      requestAnimationFrame(()=> {
        introLogo.style.opacity = 1;
        introLogo.style.transform = 'scale(1)';
      });

      setTimeout(()=>{
        introLogo.style.transition = 'opacity 500ms ease, transform 500ms ease';
        introLogo.style.opacity = 0;
        introLogo.style.transform = 'scale(.96)';
        setTimeout(()=>{ introLogo.style.display = 'none'; }, 520);

        setTimeout(()=> {
          introFlyer.style.display = 'block';
          introFlyer.style.opacity = 0;
          introFlyer.style.transform = 'translateY(12px)';
          requestAnimationFrame(()=> {
            introFlyer.style.transition = 'opacity 600ms ease, transform 600ms ease';
            introFlyer.style.opacity = 1;
            introFlyer.style.transform = 'translateY(0)';
          });
        }, 540);

        setTimeout(()=>{
          introFlyer.style.transition = 'opacity 500ms ease, transform 500ms ease';
          introFlyer.style.opacity = 0;
          introFlyer.style.transform = 'translateY(8px)';
          setTimeout(()=>{ introFlyer.style.display = 'none'; }, 520);

          setTimeout(()=>{
            introWelcome.style.display = 'block';
            introWelcome.style.opacity = 0;
            introWelcome.style.transform = 'translateY(10px)';
            requestAnimationFrame(()=> {
              introWelcome.style.transition = 'opacity 600ms ease, transform 600ms ease';
              introWelcome.style.opacity = 1;
              introWelcome.style.transform = 'translateY(0)';
            });

            setTimeout(()=>{
              introWelcome.style.transition = 'opacity 500ms ease, transform 500ms ease';
              introWelcome.style.opacity = 0;
              introWelcome.style.transform = 'translateY(8px)';
              setTimeout(()=>{
                introWelcome.style.display = 'none';
                introOverlay.style.display = 'none';
                introOverlay.setAttribute('aria-hidden','true');
                topbar.style.display = 'flex';
                topbar.style.opacity = 0;
                topbar.style.transform = 'translateY(-6px)';
                requestAnimationFrame(()=>{
                  topbar.style.transition = 'opacity 500ms ease, transform 500ms ease';
                  topbar.style.opacity = 1;
                  topbar.style.transform = 'translateY(0)';
                });
              },520);
            }, 3000); // 3s welcome
          }, 540);
        }, 5000); // 5s flyer
      }, 3000); // 3s logo
    }

    // ejecutar al cargar
    window.addEventListener('load', ()=>{
      // inicializar estados de paneles
      hideAllPanels();
      // iniciar secuencia
      runIntroSequence();
      // precarga: renderizar tablas y galería para respuesta rápida
      renderTickets();
      renderDiamantes();
      renderGallery();
    });


  </script>
</body>
</html>
